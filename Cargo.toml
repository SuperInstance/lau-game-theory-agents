[package]
name = "lau-game-theory-agents"
version = "0.1.0"
edition = "2021"
description = "Game theory for multi-agent strategic interaction — Nash equilibria, mechanism design, cooperative games, and evolutionary dynamics"
license = "MIT"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
